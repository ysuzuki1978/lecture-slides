<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#101721">
<title>スライド</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="app.css">
</head>
<body class="viewer">

<main id="layout">
  <section id="stage" aria-label="スライド">
    <img id="slide" alt="">
    <button class="tap tap-prev" id="tap-prev" aria-label="前のスライド"></button>
    <button class="tap tap-next" id="tap-next" aria-label="次のスライド"></button>
  </section>

  <!-- 発表者ビューでのみ表示 -->
  <section id="side" aria-label="発表者用">
    <div class="side-top">
      <span id="clock" class="clock">00:00</span>
      <button id="clock-reset" class="chip">リセット</button>
      <button id="open-audience" class="chip">スクリーン用ウィンドウ</button>
    </div>
    <p class="side-label">次のスライド</p>
    <img id="next" alt="">
    <p class="side-label">ノート</p>
    <div id="side-notes" class="notes-text"></div>
  </section>
</main>

<aside id="notes" class="notes-panel" hidden>
  <div id="notes-body" class="notes-text"></div>
</aside>

<div id="grid" class="grid" hidden>
  <div class="grid-head">
    <span>一覧</span>
    <button id="grid-close" class="chip">閉じる</button>
  </div>
  <ol id="grid-list"></ol>
</div>

<nav id="bar" class="bar">
  <a href="./" class="btn" aria-label="一覧へ戻る" title="一覧へ戻る"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg></a>
  <span id="title" class="bar-title"></span>
  <button id="prev" class="btn" aria-label="前へ" title="前へ（←）"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
  <span id="count" class="count">– / –</span>
  <button id="nextbtn" class="btn" aria-label="次へ" title="次へ（→）"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
  <button id="btn-grid" class="btn" title="一覧（G）" aria-label="一覧"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><rect x="14" y="14" width="6" height="6"/></svg></button>
  <button id="btn-notes" class="btn" title="ノート（N）" aria-label="ノート"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h9"/></svg></button>
  <button id="btn-presenter" class="btn wide-only" title="発表者ビュー（P）" aria-label="発表者ビュー"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14"/><path d="M14 5v14"/></svg></button>
  <button id="btn-save" class="btn" title="オフライン用に保存" aria-label="オフライン用に保存"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg></button>
  <button id="btn-fs" class="btn" title="全画面（F）" aria-label="全画面"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</nav>
<p id="toast" class="toast" role="status" hidden></p>

<script src="viewer.js"></script>
</body>
</html>
